name: Release

# Publishes to npm when a GitHub release is published — from `pnpm run release`
# or from the Releases page. To retry a publish that failed, run it by hand:
# Actions → Release → Run workflow, choosing the release's tag.
#
# This is the only workflow that publishes. It used to run on the tag push as
# well as on the release, and CI published too, so every release started three
# publishes of the same version and all but one failed.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# One publish per tag at a time; a second run waits rather than racing it.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The release's own tag, so what is published is exactly what was tagged.
          ref: ${{ github.event.release.tag_name || github.ref }}

      # Version comes from package.json's packageManager field
      - uses: pnpm/action-setup@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Check the tag matches package.json
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VERSION. Tag the commit that carries the version (pnpm run release does this)."
            exit 1
          fi
          echo "Publishing $VERSION from $TAG"

      - name: Check npm version availability
        id: npm_check
        shell: bash
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${PACKAGE_NAME}@${PACKAGE_VERSION} is already on npm; nothing to publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is not published yet."
          fi

      - name: Install dependencies
        if: steps.npm_check.outputs.published == 'false'
        run: pnpm install --frozen-lockfile

      - name: Type check
        if: steps.npm_check.outputs.published == 'false'
        run: pnpm run typecheck

      - name: Test
        if: steps.npm_check.outputs.published == 'false'
        run: pnpm test

      - name: Build
        if: steps.npm_check.outputs.published == 'false'
        run: pnpm run build

      # NPM_TOKEN must be a granular access token with read and write on this
      # package and "Bypass two-factor authentication" ticked. Without the
      # bypass npm asks for a one-time password (EOTP), which CI cannot give.
      # --no-git-checks: the checkout is the release tag, a detached HEAD, which
      # pnpm's own branch check would otherwise refuse to publish from
      - name: Publish to npm
        if: steps.npm_check.outputs.published == 'false'
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
